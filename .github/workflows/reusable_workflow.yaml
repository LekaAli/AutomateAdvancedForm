# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Reusable workflow
run-name: Reusable workflow testing on GitHub Actions
on:
  workflow_call:
    inputs:
      deploy_target:
        description: "Deploy Target"
        required: false
        type: string
        default: "staging"
      perform_deploy:
        description: "Perform deploy"
        required: true
        type: boolean
        default: false
      java-version:
        description: "Java version"
        required: true
        type: number
        default: 18

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    environment: ${{ inputs.deploy_target }}
    if: ${{ github.event_name == 'push' && inputs.perform_deploy }}
    steps:
      - run: echo "🎉 inputs.perform_deploy ${{ inputs.perform_deploy }}"
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
      - run: echo "Environment aware variable ${{ vars.ENV_NAME }}"
      - run: echo "Common to all environment variable ${{ vars.JOB_NAME }}"

      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Context Test
        env:
          JOB_NAME: "LekaAli"
        run: echo $JOB_NAME

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: Build and test with Maven
        run: mvn -B test --file pom.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/Report/
            target/surefire-reports/
            target/Screenshots/
          if-no-files-found: warn
          retention-days: 14

